name: Heptio
description: Heptio was a Seattle-based cloud-native software company founded in 2016 by Craig McLuckie and Joe
  Beda, two of the original co-creators of Kubernetes, to help enterprises adopt and operate Kubernetes. It built
  a suite of widely used open-source Kubernetes tools including Ark (later renamed Velero) for backup and restore,
  Sonobuoy for conformance testing, Contour as an Envoy-based ingress controller, ksonnet, and Gimbal. Heptio was
  acquired by VMware in November 2018 and folded into the VMware Tanzu portfolio; the company brand was retired
  and most of its open-source projects were migrated from the github.com/heptio organization to github.com/vmware-tanzu.
  This profile is preserved as a historical/defunct-company record in the API Evangelist network.
